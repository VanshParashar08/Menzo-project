<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Digital Menu — Menzo</title>
  <meta name="description" content="View digital menu and order contactless from your table." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/generator.css" />
  <style>
    body {
      background: #0B0F15;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    .customer-menu-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #FFFFFF;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    #customer-menu-mount {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Mobile full bleed */
    @media (max-width: 480px) {
      .customer-menu-viewport {
        max-width: 100%;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="customer-menu-viewport">
    <div id="customer-menu-mount">
      <!-- Mounted via src/menu.js using renderCustomerMenu -->
    </div>
  </div>

  <script type="module" src="/src/menu.js"></script>
</body>
</html>
